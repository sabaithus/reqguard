[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reqguard"
version = "1.2.0"
description = "Гибридный ИИ-агент статической проверки качества и непротиворечивости FinTech-требований (ISO/IEC/IEEE 29148 & IEEE 830)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "rich>=13.7.0",
]

[project.scripts]
reqguard = "reqguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
